[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scgc-mcp"
version = "1.3.0"
description = "MCP server for the CoS gateway surface on the chat-on-steroids fork: syncthing hub join/share tools and CoS OpenAI gateway controls"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "simple-central" }]
keywords = ["mcp", "model-context-protocol", "syncthing", "chat-on-steroids"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: File Sharing",
]
# The server is stdlib-only; the bash/python helpers ship as package data.
dependencies = []

[project.scripts]
scgc-mcp = "scgc_mcp.server:main"

[tool.setuptools]
packages = ["scgc_mcp"]

[tool.setuptools.package-data]
scgc_mcp = ["helpers/*"]
